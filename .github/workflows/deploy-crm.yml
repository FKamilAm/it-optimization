name: Deploy CRM

# CRM — отдельное приложение на поддомене crm.it-optimization.ru. Собирается и
# заливается только когда меняется она сама: публикация кейсов из панели трогает
# content/ и не должна каждый раз гонять ещё и эту сборку.
on:
  push:
    branches: [main]
    paths:
      - "crm/**"
      - "scripts/ftp-upload.py"
      - ".github/workflows/deploy-crm.yml"
  workflow_dispatch:

# Тот же FTP-аккаунт, что у сайта: две одновременные заливки дерутся за
# соединение и обе становятся вдвое медленнее.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crm/package-lock.json

      - run: npm ci
        working-directory: crm

      # Адрес API вшивается в бандл на этапе сборки — рантайма у статики нет.
      - name: Build
        working-directory: crm
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.CRM_API_URL || 'https://api.it-optimization.ru' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check FTP password is configured
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secret FTP_PASSWORD is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Upload crm/dist over FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_LOCAL_ROOT: crm/dist
          FTP_REMOTE_ROOT: ${{ vars.CRM_FTP_ROOT || '/www/crm.it-optimization.ru' }}
        run: python scripts/ftp-upload.py
