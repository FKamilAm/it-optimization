<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Парсинг данных">
  <defs>
    <linearGradient id="parBg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="parGlow" cx="0.5" cy="0.42" r="0.55">
      <stop stop-color="#b4e02d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b4e02d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="parCyl" x1="600" y1="470" x2="600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4e02d"/>
      <stop offset="1" stop-color="#8fbf1f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#parBg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>
  <rect width="1200" height="750" fill="url(#parGlow)"/>

  <!-- scattered raw data: bits and points -->
  <g fill="#ffffff" font-family="monospace" font-size="30" font-weight="600">
    <text x="360" y="170" fill-opacity="0.35">1011</text>
    <text x="470" y="150" fill-opacity="0.22">0100</text>
    <text x="600" y="168" fill-opacity="0.3">1101</text>
    <text x="720" y="150" fill-opacity="0.22">0011</text>
    <text x="820" y="176" fill-opacity="0.3">1010</text>
    <text x="410" y="214" fill-opacity="0.18">0110</text>
    <text x="560" y="220" fill-opacity="0.25">1001</text>
    <text x="700" y="214" fill-opacity="0.18">0111</text>
  </g>
  <g fill="#b4e02d">
    <circle cx="380" cy="250" r="6" fill-opacity="0.7"/>
    <circle cx="520" cy="262" r="5" fill-opacity="0.5"/>
    <circle cx="660" cy="252" r="6" fill-opacity="0.7"/>
    <circle cx="790" cy="264" r="5" fill-opacity="0.5"/>
    <circle cx="470" cy="248" r="4" fill-opacity="0.4"/>
    <circle cx="720" cy="250" r="4" fill-opacity="0.4"/>
  </g>

  <!-- funnel: the parser collecting scattered data -->
  <g>
    <path d="M360 300h480l-150 150v96l-180 60v-156L360 300z" fill="#ffffff" fill-opacity="0.05" stroke="#b4e02d" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"/>
    <!-- flow lines into funnel -->
    <g stroke="#b4e02d" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 11">
      <line x1="440" y1="300" x2="560" y2="150"/>
      <line x1="600" y1="300" x2="600" y2="150"/>
      <line x1="760" y1="300" x2="700" y2="150"/>
    </g>
  </g>

  <!-- structured output: database cylinder -->
  <g transform="translate(600 470)">
    <ellipse cx="0" cy="150" rx="86" ry="24" fill="#0a0a0a"/>
    <path d="M-86 0v150c0 13 38 24 86 24s86-11 86-24V0z" fill="url(#parCyl)"/>
    <path d="M-86 0v150c0 13 38 24 86 24s86-11 86-24V0z" fill="#0a0a0a" fill-opacity="0.06"/>
    <ellipse cx="0" cy="0" rx="86" ry="24" fill="#c8ef4d"/>
    <ellipse cx="0" cy="52" rx="86" ry="24" fill="none" stroke="#0a0a0a" stroke-opacity="0.25" stroke-width="3"/>
    <ellipse cx="0" cy="104" rx="86" ry="24" fill="none" stroke="#0a0a0a" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <circle cx="260" cy="540" r="8" fill="#b4e02d"/>
  <circle cx="940" cy="560" r="6" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="920" cy="240" r="5" fill="#ffffff" fill-opacity="0.3"/>
</svg>
