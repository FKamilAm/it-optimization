# Боевой стенд на VPS: Caddy (HTTPS) → API → PostgreSQL.
#
# Отличия от локального docker-compose.yml, и все они намеренные:
#  - ни база, ни API не публикуют порты наружу. Единственное, что видно из
#    интернета, — 80 и 443 у Caddy. Postgres недоступен снаружи в принципе,
#    даже если файрвол однажды настроят неправильно;
#  - пароль базы берётся из окружения, а не зашит в файл;
#  - у контейнеров есть healthcheck и ограничение на размер логов, иначе за
#    полгода они съедят диск.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d
# Обновление кода:  git pull && docker compose -f docker-compose.prod.yml up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Сюда пишет scripts/backup.sh — дампы лежат на хосте, а не только в томе.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      # Внутри сети compose база доступна по имени сервиса, не по localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /app/uploads
      PORT: 4000
      # Сид читает снапшот отсюда: в образ попадает только server/, а
      # content/ лежит уровнем выше и монтируется отдельно.
      CASES_SNAPSHOT: /app/content/cases.json
    volumes:
      # Картинки кейсов переживают пересоздание контейнера. Том обязателен:
      # без него первая же пересборка образа сотрёт всё загруженное.
      - uploads:/app/uploads
      # Только для разового сида, на чтение.
      - ../content:/app/content:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домен API и почта для Let's Encrypt — задаются в .env.
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN не задан в .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Выданные сертификаты. Без этого тома при каждом перезапуске Caddy
      # запрашивает новые и упирается в лимиты Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
